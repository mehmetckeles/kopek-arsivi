<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarihten Köpekler — Köpek ve insanlık tarihi üzerine yazılar</title>
<meta name="description" content="Köpeklerin ve köpek-insan ilişkisinin tarihi üzerine düzenli yayımlanan Türkçe yazılar. Evcilleştirmeden mitolojiye, savaşlardan bilime — tarihin içinden köpekler.">
<meta property="og:title" content="Tarihten Köpekler">
<meta property="og:description" content="Köpek ve insanlık tarihi üzerine Türkçe yazılar.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
<style>
  :root {
    color-scheme: light;
    --bg:        #e8e2d5;
    --surface:   #ede7d8;
    --surface2:  #f5f0e6;
    --border:    #cac3ae;
    --text:      #2a2520;
    --muted:     #8c8272;
    --accent:    #c4613f;
    --accent-l:  #f5e8e0;
    --tag-bg:    #d5e6c5;
    --tag-tx:    #355228;
    --tag-sp-bg: #f5e0a0;
    --tag-sp-tx: #6b4800;
    --r: 7px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* Belge kendisi asla kaymamalı; kaydırma yalnızca iç panellerde olur.
     Aksi halde başlık ekranın dışına çıkabiliyor. */
  html { height: 100%; overflow: hidden; }

  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;   /* eski tarayıcılar için */
    height: 100dvh;  /* mobilde adres çubuğu açılıp kapandıkça uyum sağlar */
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ─ HEADER ────────────────────────────────────── */
  header {
    background: #2a2520;
    color: #efe9dc;
    padding: .55rem 1.1rem;
    display: flex;
    align-items: center;
    gap: .6rem;
    flex-shrink: 0;
    border-bottom: 1px solid rgba(0,0,0,.25);
    box-shadow: 0 1px 6px rgba(0,0,0,.12);
  }

  /* marka = ana sayfa bağlantısı */
  .brand {
    display: flex; align-items: baseline; gap: .5rem;
    min-width: 0; background: none; border: 0; padding: .15rem .3rem;
    margin-left: -.3rem; border-radius: var(--r);
    color: inherit; cursor: pointer; font-family: Georgia, serif;
    transition: background .12s;
  }
  .brand:hover { background: rgba(255,255,255,.07); }
  .brand:active { background: rgba(255,255,255,.12); }
  .brand .paw { font-size: .95rem; line-height: 1; }
  .brand .bname { font-size: 1rem; font-weight: 700; white-space: nowrap; letter-spacing: .01em; }
  .brand .sub {
    font-size: .68rem; opacity: .5; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
    font-family: -apple-system, system-ui, sans-serif;
    padding-left: .3rem; border-left: 1px solid rgba(255,255,255,.18);
  }

  .hactions { margin-left: auto; display: flex; align-items: center; gap: .4rem; }
  .count {
    font-size: .68rem; opacity: .45; white-space: nowrap; margin-right: .2rem;
    font-family: -apple-system, system-ui, sans-serif;
  }

  .hbtn {
    display: inline-flex; align-items: center; gap: .35rem;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.14);
    color: #efe9dc; border-radius: var(--r);
    padding: .32rem .6rem; font-size: .85rem; line-height: 1;
    cursor: pointer; white-space: nowrap;
    transition: background .12s, border-color .12s;
  }
  .hbtn:hover { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.24); }
  .hbtn .hlbl { font-family: -apple-system, system-ui, sans-serif; font-size: .72rem; }
  .hbtn.menu-btn { display: none; }
  #home-btn { display: none; }
  #home-btn.show { display: inline-flex; }

  /* ─ LAYOUT ────────────────────────────────────── */
  .body { flex: 1; display: flex; overflow: hidden; position: relative; }

  /* ─ SIDEBAR ───────────────────────────────────── */
  .sidebar {
    width: 280px; flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .sidebar-top {
    flex-shrink: 0;
    max-height: 60%;
    padding: .7rem .65rem .75rem;
    background: var(--surface2);
    border-bottom: 1px solid #bdb49c;
    box-shadow: 0 2px 5px rgba(42,37,32,.07);
    position: relative; z-index: 2;
    display: flex; flex-direction: column; gap: .45rem;
  }
  .search {
    width: 100%; padding: .4rem .65rem;
    border: 1px solid var(--border); border-radius: var(--r);
    background: #fbf8f0; font-size: .82rem;
    color: var(--text); font-family: Georgia, serif; outline: none;
  }
  .search:focus { border-color: var(--accent); }
  .tag-filter {
    display: flex; flex-wrap: wrap; gap: .25rem;
    max-height: 42vh; overflow-y: auto;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  }
  .tfc {
    display: inline-flex; align-items: center;
    padding: .2rem .5rem; border-radius: 99px;
    font-size: .67rem; cursor: pointer;
    background: var(--tag-bg); color: var(--tag-tx); opacity: .72;
    font-family: -apple-system, system-ui, sans-serif;
    border: 1px solid transparent; user-select: none;
    transition: opacity .12s, border-color .12s;
  }
  .tfc.sp { background: var(--tag-sp-bg); color: var(--tag-sp-tx); }
  .tfc:hover { opacity: 1; }
  .tfc.on { opacity: 1; font-weight: 600; border-color: #9dc47f; }
  .tfc.sp.on { border-color: #d4a830; }
  .tfc.more {
    background: transparent; color: var(--muted);
    border: 1px dashed var(--border); opacity: 1;
  }
  .tfc.more:hover { border-color: var(--accent); color: var(--accent); }
  .tfc.clear { background: var(--accent-l); color: var(--accent); border-color: #e0b898; }

  .alist {
    flex: 1; min-height: 0;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    background: var(--surface);
  }
  .aitem {
    padding: .62rem .8rem; cursor: pointer;
    border-left: 3px solid transparent;
    border-bottom: 1px solid var(--border);
    transition: background .12s;
  }
  .aitem:last-child { border-bottom: none; }
  .aitem:hover { background: var(--bg); }

  /* Okunmakta olan yazı — renge değil, yazıya dayalı ayrım */
  .aitem.on {
    border-left-width: 4px;
    border-left-color: var(--accent);
    background: var(--accent-l);
  }
  .aitem.on .aitem-title { color: var(--accent-h); }
  .aitem.on .aitem-meta  { color: #a3765e; }

  .nowlbl { display: none; }
  .aitem.on .nowlbl {
    display: flex; align-items: center; gap: .3rem;
    font-size: .58rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: .09em;
    color: var(--accent); margin-bottom: .3rem;
    font-family: -apple-system, system-ui, sans-serif;
  }
  .nowlbl::before {
    content: ''; width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent); flex-shrink: 0;
  }

  .aitem-title { font-size: .82rem; font-weight: 600; line-height: 1.35; }
  .aitem-meta {
    font-size: .67rem; color: var(--muted); margin-top: .2rem;
    font-family: -apple-system, system-ui, sans-serif;
  }
  .aitem-tags { display: flex; flex-wrap: wrap; gap: .18rem; margin-top: .28rem; }
  .tmini {
    display: inline-flex; align-items: center;
    padding: .12rem .4rem; border-radius: 99px; font-size: .61rem;
    background: var(--tag-bg); color: var(--tag-tx); cursor: pointer;
    font-family: -apple-system, system-ui, sans-serif;
  }
  .tmini.sp { background: var(--tag-sp-bg); color: var(--tag-sp-tx); }
  .empty-list { padding: 1.1rem; font-size: .78rem; color: var(--muted); text-align: center; }

  /* ─ READER ────────────────────────────────────── */
  .reader {
    flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  .rcontent { max-width: 700px; margin: 0 auto; padding: 3rem 2rem 4rem; width: 100%; }

  .atitle { font-size: 1.7rem; font-weight: 700; line-height: 1.25; margin-bottom: .55rem; }
  .ameta {
    font-size: .72rem; color: var(--muted); margin-bottom: 1.4rem;
    font-family: -apple-system, system-ui, sans-serif;
    display: flex; flex-wrap: wrap; gap: .3rem; align-items: center;
  }
  .ameta .dot { opacity: .5; }

  .prose { line-height: 1.9; font-size: 1.06rem; }
  .prose h2 { font-size: 1.14rem; font-weight: 700; margin-top: 2rem; margin-bottom: .5rem; }
  .prose h3 { font-size: .99rem; font-weight: 700; margin-top: 1.3rem; margin-bottom: .35rem; }
  .prose p { margin-bottom: 1.05rem; }
  .prose p:last-child { margin-bottom: 0; }
  .prose hr { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
  .prose em { font-style: italic; }
  .prose strong { font-weight: 700; }

  .afoot {
    margin-top: 2.6rem; padding-top: 1.3rem;
    border-top: 1px solid var(--border);
    display: flex; flex-wrap: wrap; gap: .45rem; align-items: center;
  }
  .afoot .lbl {
    font-size: .72rem; color: var(--muted); margin-right: .25rem;
    font-family: -apple-system, system-ui, sans-serif;
  }
  /* Yazı sonundaki etiketler arşive giriş kapısı — rahat basılabilir olmalı */
  .afoot .tmini {
    font-size: .84rem;
    padding: .36rem .85rem;
    line-height: 1.25;
    border: 1px solid transparent;
    transition: border-color .12s, transform .08s;
  }
  .afoot .tmini:hover { border-color: #9dc47f; }
  .afoot .tmini.sp:hover { border-color: #d4a830; }
  .afoot .tmini:active { transform: scale(.96); }

  .nav-pair { display: flex; gap: .5rem; margin-top: 1.6rem; flex-wrap: wrap; }
  .navbtn {
    flex: 1; min-width: 180px;
    border: 1px solid var(--border); border-radius: var(--r);
    background: var(--surface2); padding: .6rem .8rem;
    cursor: pointer; text-align: left; font-family: Georgia, serif;
    color: var(--text); transition: background .12s;
  }
  .navbtn:hover { background: var(--surface); }
  .navbtn .dir {
    display: block; font-size: .65rem; color: var(--muted);
    font-family: -apple-system, system-ui, sans-serif; margin-bottom: .15rem;
  }
  .navbtn .ttl { display: block; font-size: .8rem; font-weight: 600; line-height: 1.3; }

  /* ─ YAZI SONU DAVETİ ──────────────────────────── */
  .endnote {
    margin-top: 1.8rem; padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    display: flex; flex-direction: column;
    align-items: center; gap: .5rem;
  }
  .morebtn {
    display: inline-flex; align-items: center; gap: .5rem;
    background: var(--accent-l); border: 1px solid #e0b898;
    color: var(--accent); border-radius: 99px;
    padding: .55rem 1.4rem; min-height: 44px;
    font-size: .88rem; cursor: pointer;
    font-family: -apple-system, system-ui, sans-serif;
    transition: background .12s, transform .08s;
  }
  .morebtn:hover { background: #f0dbcf; }
  .morebtn:active { transform: scale(.97); }
  .endnote .hint {
    font-size: .68rem; color: var(--muted);
    font-family: -apple-system, system-ui, sans-serif;
  }
  @media (max-width: 780px) { .endnote .hint { display: none; } }

  /* ─ INTRO / EMPTY ─────────────────────────────── */
  .intro {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 1rem; padding: 2rem; text-align: center;
  }
  .intro .emo { font-size: 3.4rem; }
  .intro h2 { font-size: 1.2rem; }
  .intro p { font-size: .9rem; line-height: 1.75; color: var(--muted); max-width: 380px; }

  /* ─ MOBILE ────────────────────────────────────── */
  .scrim { display: none; position: absolute; inset: 0; background: rgba(30,24,18,.45); z-index: 40; }
  .scrim.show { display: block; }

  @media (max-width: 780px) {
    .hbtn.menu-btn { display: inline-flex; }
    .brand .sub { display: none; }
    .count { display: none; }
    .hbtn .hlbl { display: none; }
    header { padding: .55rem .8rem; gap: .45rem; }
    .sidebar {
      position: absolute; inset: 0 auto 0 0; z-index: 50;
      width: 84%; max-width: 320px;
      transform: translateX(-102%);
      transition: transform .22s ease;
      box-shadow: 4px 0 24px rgba(0,0,0,.18);
    }
    .sidebar.open { transform: translateX(0); }
    .rcontent {
      padding: 1.8rem 1.15rem calc(4rem + env(safe-area-inset-bottom, 0px));
    }

    /* Dokunmatik hedefler — parmakla rahat basılabilecek yükseklikte */
    .afoot { gap: .5rem; }
    .afoot .tmini { font-size: .88rem; padding: 0 1rem; min-height: 42px; }
    .tfc { font-size: .78rem; padding: 0 .8rem; min-height: 36px; }
    .tag-filter { gap: .4rem; }
    .aitem-tags { gap: .3rem; margin-top: .4rem; }
    .aitem .tmini { font-size: .7rem; padding: .22rem .6rem; }
    .htag { font-size: .84rem; padding: 0 .95rem; min-height: 40px; }
    .home-tags { gap: .45rem; }
    .home { padding-bottom: calc(4rem + env(safe-area-inset-bottom, 0px)); }
    .prose { font-size: 1.02rem; line-height: 1.85; }
    .atitle { font-size: 1.4rem; }
  }

  /* ─ OKUMA İLERLEMESİ ──────────────────────────── */
  .progress {
    position: sticky; top: 0; left: 0; height: 2px; width: 100%;
    background: transparent; z-index: 30; flex-shrink: 0;
  }
  .progress span {
    display: block; height: 100%; width: 0;
    background: var(--accent); transition: width .1s linear;
  }

  /* ─ GİRİŞ EKRANI ──────────────────────────────── */
  .home { max-width: 640px; margin: 0 auto; padding: 3rem 2rem 4rem; width: 100%; }
  .home-head { text-align: center; margin-bottom: 2.4rem; }
  .home-head .emo { font-size: 3rem; display: block; margin-bottom: .5rem; }
  .home-head h2 { font-size: 1.35rem; margin-bottom: .5rem; }
  .home-head p { font-size: .9rem; line-height: 1.75; color: var(--muted); }

  .sec-lbl {
    font-size: .68rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: .07em; color: var(--muted); margin-bottom: .6rem;
    font-family: -apple-system, system-ui, sans-serif;
  }
  .home-sec { margin-bottom: 2rem; }

  .feat {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: var(--surface2); border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: var(--r); padding: 1rem 1.15rem;
    font-family: Georgia, serif; color: var(--text);
    transition: background .12s;
  }
  .feat:hover { background: var(--surface); }
  .feat .ft { display: block; font-size: 1.02rem; font-weight: 700; line-height: 1.35; margin-bottom: .35rem; }
  .feat .fm {
    display: block; font-size: .68rem; color: var(--muted); margin-bottom: .5rem;
    font-family: -apple-system, system-ui, sans-serif;
  }
  .feat .fx { display: block; font-size: .85rem; line-height: 1.6; color: var(--muted); }

  .home-tags { display: flex; flex-wrap: wrap; gap: .3rem; }
  .htag {
    display: inline-flex; align-items: center;
    padding: .26rem .6rem; border-radius: 99px; font-size: .74rem; cursor: pointer;
    background: var(--tag-bg); color: var(--tag-tx);
    font-family: -apple-system, system-ui, sans-serif;
    border: 1px solid transparent; transition: all .12s;
  }
  .htag:hover { border-color: #b8d4a0; }
  .htag.sp { background: var(--tag-sp-bg); color: var(--tag-sp-tx); }
  .htag.sp:hover { border-color: #d4a830; }
  .htag .n { opacity: .55; font-size: .68rem; margin-left: .15rem; }

  .home-foot {
    display: flex; gap: .5rem; flex-wrap: wrap;
    padding-top: 1.4rem; border-top: 1px solid var(--border);
  }
  .lbtn {
    padding: .45rem .9rem; border-radius: var(--r);
    border: 1px solid var(--border); background: var(--surface2);
    color: var(--text); font-size: .8rem; cursor: pointer;
    font-family: -apple-system, system-ui, sans-serif; transition: background .12s;
  }
  .lbtn:hover { background: var(--surface); }

  /* ─ İLGİLİ YAZILAR ────────────────────────────── */
  .rel { margin-top: 2.2rem; }
  .rel-list { display: flex; flex-direction: column; gap: .4rem; }
  .relbtn {
    text-align: left; cursor: pointer; width: 100%;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--r); padding: .55rem .8rem;
    font-family: Georgia, serif; color: var(--text); transition: background .12s;
  }
  .relbtn:hover { background: var(--surface); }
  .relbtn .rt { display: block; font-size: .84rem; font-weight: 600; line-height: 1.35; }
  .relbtn .rw {
    display: block; font-size: .66rem; color: var(--muted); margin-top: .25rem;
    font-family: -apple-system, system-ui, sans-serif;
  }
  .rel-list { gap: .45rem; }
  .relbtn { padding: .6rem .85rem; }

  @media (max-width: 780px) {
    .home { padding: 2rem 1.15rem 3rem; }
  }
  #reader-body { flex: 1; display: flex; flex-direction: column; }
</style>
</head>
<body>

<header>
  <button class="hbtn menu-btn" id="menu-btn" aria-label="Menü">☰</button>

  <button class="brand" data-home="1" title="Ana sayfaya dön">
    <span class="paw">🐾</span>
    <span class="bname">Tarihten Köpekler</span>
    <span class="sub">köpek ve insanlık tarihi üzerine yazılar</span>
  </button>

  <div class="hactions">
    <span class="count" id="count"></span>
    <button class="hbtn" id="home-btn" data-home="1" title="Ana sayfaya dön">
      <span aria-hidden="true">←</span><span class="hlbl">Ana sayfa</span>
    </button>
    <button class="hbtn" id="rnd-btn" title="Rastgele bir yazı aç (R)">
      <span aria-hidden="true">✦</span><span class="hlbl">Rastgele</span>
    </button>
  </div>
</header>

<div class="body">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <input class="search" id="search" type="text" placeholder="Yazılarda ara…" autocomplete="off">
      <div class="tag-filter" id="tag-filter"></div>
    </div>
    <div class="alist" id="alist"></div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <main class="reader" id="reader">
    <div class="progress"><span id="progress-bar"></span></div>
    <div id="reader-body"></div>
  </main>
</div>

<script>
// ─── State ───────────────────────────────────────────────────
let ARTICLES   = [];
let activeSlug = null;
let activeTag  = null;
let query      = '';

// ─── Helpers ─────────────────────────────────────────────────
const isSpecific = t => t.startsWith('@');
const displayTag = t => t.replace(/^@/, '');
const tagCls = (base, t) => isSpecific(t) ? base + ' sp' : base;

// Turkish needs transliteration *before* toLowerCase: "İ" lowercases to
// "i" + a combining dot (U+0307), which would otherwise become a hyphen.
const TR_MAP = {
  'ç':'c','Ç':'c','ğ':'g','Ğ':'g','ı':'i','İ':'i',
  'ö':'o','Ö':'o','ş':'s','Ş':'s','ü':'u','Ü':'u',
  'â':'a','Â':'a','î':'i','Î':'i','û':'u','Û':'u'
};
function slugify(s) {
  const full = String(s)
    .replace(/[çÇğĞıİöÖşŞüÜâÂîÎûÛ]/g, c => TR_MAP[c] || c)
    .toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')   // drop leftover accents
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '');

  if (full.length <= 70) return full;
  // trim to 70 chars, but drop a half-word if the cut landed inside one
  const cut = full.slice(0, 70);
  return (full[70] === '-' ? cut : cut.replace(/-[^-]*$/, '')).replace(/-+$/, '');
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleDateString('tr-TR', { day:'numeric', month:'long', year:'numeric' });
}

function readMin(md) { return Math.max(1, Math.ceil(md.split(/\s+/).length / 200)); }

// ─── Markdown ────────────────────────────────────────────────
function mdToHtml(md) {
  const span = s => esc(s)
    .replace(/\*\*(.+?)\*\*/g, (_,t) => '<strong>' + t + '</strong>')
    .replace(/\*(.+?)\*/g,     (_,t) => '<em>' + t + '</em>');
  const out = []; let para = [];
  const flush = () => { if (para.length) { out.push('<p>' + span(para.join(' ')) + '</p>'); para = []; } };
  for (const raw of md.split('\n')) {
    const l = raw.trimEnd();
    if      (/^###\s/.test(l)) { flush(); out.push('<h3>' + span(l.slice(4)) + '</h3>'); }
    else if (/^##\s/.test(l))  { flush(); out.push('<h2>' + span(l.slice(3)) + '</h2>'); }
    else if (/^#\s/.test(l))   { flush(); out.push('<h2>' + span(l.slice(2)) + '</h2>'); }
    else if (/^---+$/.test(l)) { flush(); out.push('<hr>'); }
    else if (!l.trim())        { flush(); }
    else                       { para.push(l.trim()); }
  }
  flush();
  return out.join('\n');
}

// Body without the leading H1 — the title is rendered separately
function bodyWithoutTitle(md) {
  return md.replace(/^#\s+.+\n?/, '').trimStart();
}

// ─── Data ────────────────────────────────────────────────────
function allTags() {
  const counts = new Map();
  ARTICLES.forEach(a => (a.tags || []).forEach(t => counts.set(t, (counts.get(t) || 0) + 1)));
  return [...counts.entries()]
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'tr'))
    .map(e => e[0]);
}

function filtered() {
  let list = ARTICLES;
  if (activeTag) list = list.filter(a => (a.tags || []).includes(activeTag));
  if (query) {
    const q = query.toLowerCase();
    list = list.filter(a =>
      a.title.toLowerCase().includes(q) || a.content.toLowerCase().includes(q));
  }
  return list;
}

// ─── Render: sidebar ─────────────────────────────────────────
const TAG_LIMIT = 16;
let tagsExpanded = false;

function renderTags() {
  const tags = allTags();
  const clear = activeTag ? '<span class="tfc clear" data-clear="1">× Tümü</span>' : '';

  // Seçili etiket kısaltılmış listede yoksa yine de görünsün
  let shown = tags;
  let hidden = 0;
  if (!tagsExpanded && tags.length > TAG_LIMIT) {
    shown = tags.slice(0, TAG_LIMIT);
    if (activeTag && !shown.includes(activeTag)) shown = shown.concat(activeTag);
    hidden = tags.length - shown.length;
  }

  const chips = shown.map(t =>
    '<span class="' + tagCls('tfc', t) + (activeTag === t ? ' on' : '') +
    '" data-tag="' + esc(t) + '">' + esc(displayTag(t)) + '</span>'
  ).join('');

  const toggle = tags.length > TAG_LIMIT
    ? '<span class="tfc more" data-tagtoggle="1">' +
      (tagsExpanded ? '− daha az' : '+ ' + hidden + ' etiket') + '</span>'
    : '';

  document.getElementById('tag-filter').innerHTML = clear + chips + toggle;
}

function renderList() {
  const list = filtered();
  const el = document.getElementById('alist');
  if (!list.length) {
    el.innerHTML = '<div class="empty-list">Yazı bulunamadı.</div>';
    return;
  }
  el.innerHTML = list.map(a =>
    '<article class="aitem' + (activeSlug === a.slug ? ' on' : '') + '" data-slug="' + esc(a.slug) + '">' +
      '<span class="nowlbl">Şu an okuyorsun</span>' +
      '<div class="aitem-title">' + esc(a.title) + '</div>' +
      '<div class="aitem-meta">' + fmtDate(a.date) + ' · ' + readMin(a.content) + ' dk okuma</div>' +
      ((a.tags || []).length
        ? '<div class="aitem-tags">' + a.tags.map(t =>
            '<span class="' + tagCls('tmini', t) + '" data-tag="' + esc(t) + '">' +
            esc(displayTag(t)) + '</span>').join('') + '</div>'
        : '') +
    '</article>').join('');
}

function renderCount() {
  document.getElementById('count').textContent =
    ARTICLES.length ? ARTICLES.length + ' yazı' : '';
}

// ─── Render: reader ──────────────────────────────────────────
function excerpt(md, n) {
  const t = bodyWithoutTitle(md)
    .split('\n').filter(l => l.trim() && !l.startsWith('#') && !/^---+$/.test(l))
    .join(' ').replace(/[*_`]/g, '');
  return t.length > n ? t.slice(0, n).replace(/\s+\S*$/, '') + '…' : t;
}

function renderIntro() {
  const kaydiran = document.getElementById('reader');
  if (kaydiran) kaydiran.scrollTop = 0;
  const body = document.getElementById('reader-body');
  if (!ARTICLES.length) {
    body.innerHTML =
      '<div class="intro"><div class="emo">🐕</div>' +
      '<h2>Arşiv hazırlanıyor</h2>' +
      '<p>Henüz yayımlanmış bir yazı yok. Kısa süre içinde burada olacaklar.</p></div>';
    return;
  }

  const latest = ARTICLES[0];
  const counts = new Map();
  ARTICLES.forEach(a => (a.tags || []).forEach(t => counts.set(t, (counts.get(t) || 0) + 1)));
  const topTags = [...counts.entries()]
    .filter(e => e[1] > 1)
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'tr'))
    .slice(0, 12);

  body.innerHTML =
    '<div class="home">' +
      '<div class="home-head">' +
        '<span class="emo">🐾</span>' +
        '<h2>Tarihten Köpekler</h2>' +
        '<p>Köpeklerin ve köpek-insan ilişkisinin tarihi üzerine yazılar. ' +
        'Evcilleştirmeden mitolojiye, savaşlardan bilime — her sabah bir yenisi ekleniyor.</p>' +
      '</div>' +

      '<div class="home-sec">' +
        '<div class="sec-lbl">En son yazı</div>' +
        '<button class="feat" data-slug="' + esc(latest.slug) + '">' +
          '<span class="ft">' + esc(latest.title) + '</span>' +
          '<span class="fm">' + fmtDate(latest.date) + ' · ' + readMin(latest.content) + ' dk okuma</span>' +
          '<span class="fx">' + esc(excerpt(latest.content, 180)) + '</span>' +
        '</button>' +
      '</div>' +

      (topTags.length ? '<div class="home-sec">' +
        '<div class="sec-lbl">Konuya göre</div>' +
        '<div class="home-tags">' + topTags.map(([t, n]) =>
          '<span class="' + tagCls('htag', t) + '" data-tag="' + esc(t) + '">' +
          esc(displayTag(t)) + '<span class="n">' + n + '</span></span>').join('') +
        '</div></div>' : '') +

      '<div class="home-foot">' +
        '<button class="lbtn" data-random="1">✦ Rastgele bir yazı</button>' +
        '<button class="lbtn" data-slug="' + esc(ARTICLES[ARTICLES.length - 1].slug) + '">↓ En eski yazı</button>' +
      '</div>' +
    '</div>';
}

// Ortak etikete göre ilgili yazılar; özel isim (@) eşleşmesi daha ağır sayılır
function related(a, n) {
  const mine = new Set(a.tags || []);
  if (!mine.size) return [];
  return ARTICLES
    .filter(x => x.slug !== a.slug)
    .map(x => {
      let score = 0;
      (x.tags || []).forEach(t => { if (mine.has(t)) score += isSpecific(t) ? 3 : 1; });
      return { x, score };
    })
    .filter(r => r.score > 0)
    .sort((p, q) => q.score - p.score || new Date(q.x.date) - new Date(p.x.date))
    .slice(0, n)
    .map(r => r.x);
}

function renderArticle(slug) {
  const a = ARTICLES.find(x => x.slug === slug);
  const reader = document.getElementById('reader-body');
  if (!a) { renderIntro(); return; }

  const list = filtered();
  const i    = list.findIndex(x => x.slug === slug);
  const prev = i > 0 ? list[i - 1] : null;                            // newer
  const next = (i >= 0 && i < list.length - 1) ? list[i + 1] : null;  // older

  reader.innerHTML =
    '<div class="rcontent">' +
      '<h1 class="atitle">' + esc(a.title) + '</h1>' +
      '<div class="ameta"><span>' + fmtDate(a.date) + '</span>' +
        '<span class="dot">·</span><span>' + readMin(a.content) + ' dakika okuma</span></div>' +
      '<div class="prose">' + mdToHtml(bodyWithoutTitle(a.content)) + '</div>' +
      ((a.tags || []).length
        ? '<div class="afoot"><span class="lbl">Etiketler:</span>' +
          a.tags.map(t => '<span class="' + tagCls('tmini', t) + '" data-tag="' + esc(t) + '">' +
            esc(displayTag(t)) + '</span>').join('') + '</div>'
        : '') +
      (function(){
        const r = related(a, 3);
        return r.length
          ? '<div class="rel"><div class="sec-lbl">İlgili yazılar</div><div class="rel-list">' +
            r.map(x => '<button class="relbtn" data-slug="' + esc(x.slug) + '">' +
              '<span class="rt">' + esc(x.title) + '</span>' +
              '<span class="rw">' + fmtDate(x.date) + ' · ' + readMin(x.content) + ' dk</span>' +
              '</button>').join('') + '</div></div>'
          : '';
      })() +
      ((prev || next)
        ? '<div class="nav-pair">' +
          (prev ? '<button class="navbtn" data-slug="' + esc(prev.slug) + '">' +
            '<span class="dir">← Daha yeni</span><span class="ttl">' + esc(prev.title) + '</span></button>' : '') +
          (next ? '<button class="navbtn" data-slug="' + esc(next.slug) + '">' +
            '<span class="dir">Daha eski →</span><span class="ttl">' + esc(next.title) + '</span></button>' : '') +
          '</div>'
        : '') +
      '<div class="endnote">' +
        '<button class="morebtn" data-random="1">✦ ' +
          (rastgeleGeldi ? 'Bir tane daha' : 'Rastgele bir yazı') +
        '</button>' +
        '<span class="hint">ya da R tuşu</span>' +
      '</div>' +
    '</div>';

  // Kaydıran öğe #reader; #reader-body yalnızca içerik kabı.
  const kaydiran = document.getElementById('reader');
  if (kaydiran) kaydiran.scrollTop = 0;
  setProgress(0);
  document.title = a.title + ' — Tarihten Köpekler';
}

// ─── Navigation ──────────────────────────────────────────────
let rastgeleGeldi = false;

function openArticle(slug, push, rastgele) {
  rastgeleGeldi = !!rastgele;
  activeSlug = slug;
  if (push !== false) location.hash = slug ? '/' + slug : '';
  renderList();
  renderArticle(slug);
  closeSidebar();
  setProgress(0);
  updateHeader();
  revealActive();
}

function goHome() {
  activeSlug = null;
  location.hash = '';
  renderList();
  renderIntro();
  updateHeader();
  setProgress(0);
  const r = document.getElementById('reader');
  if (r) r.scrollTop = 0;
  document.title = 'Tarihten Köpekler — Köpek ve insanlık tarihi üzerine yazılar';
  closeSidebar();
}

// "Ana sayfa" düğmesi yalnızca bir yazı açıkken görünür
function updateHeader() {
  const b = document.getElementById('home-btn');
  if (b) b.classList[activeSlug ? 'add' : 'remove']('show');
}

// Seçili yazıyı listede görünür kılar.
// scrollIntoView kullanılmaz: mobilde kenar çubuğu ekran dışındayken
// tarayıcı sayfanın tamamını kaydırıp başlığı görünmez yapıyordu.
function revealActive() {
  const list = document.getElementById('alist');
  const on   = list && list.querySelector('.aitem.on');
  if (!list || !on) return;
  const ust  = on.offsetTop;
  const alt  = ust + on.offsetHeight;
  if (ust < list.scrollTop) list.scrollTop = ust;
  else if (alt > list.scrollTop + list.clientHeight) list.scrollTop = alt - list.clientHeight;
}

function randomArticle() {
  const list = filtered().filter(a => a.slug !== activeSlug);
  const pool = list.length ? list : ARTICLES;
  if (!pool.length) return;
  openArticle(pool[Math.floor(Math.random() * pool.length)].slug, true, true);
}

// ── okuma ilerlemesi ────────────────────────────────────────
function setProgress(v) {
  const b = document.getElementById('progress-bar');
  if (b) b.style.width = (v * 100) + '%';
}

function updateProgress() {
  const r = document.getElementById('reader');
  if (!r) return;
  if (!activeSlug) { setProgress(0); return; }
  const max = r.scrollHeight - r.clientHeight;
  setProgress(max > 40 ? Math.min(1, r.scrollTop / max) : 0);
}

// ── komşu yazıya geç ────────────────────────────────────────
function step(dir) {
  const list = filtered();
  const i = list.findIndex(x => x.slug === activeSlug);
  if (i < 0) { if (list.length) openArticle(list[0].slug); return; }
  const j = i + dir;
  if (j >= 0 && j < list.length) openArticle(list[j].slug);
}

function setTag(t) {
  activeTag = (activeTag === t) ? null : t;
  renderTags();
  renderList();
}

function clearTag() { activeTag = null; renderTags(); renderList(); }

function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('scrim').classList.add('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('scrim').classList.remove('show');
}

function handleHash() {
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  if (!h) {
    activeSlug = null;
    renderList();
    renderIntro();
    updateHeader();
    setProgress(0);
    document.title = 'Tarihten Köpekler — Köpek ve insanlık tarihi üzerine yazılar';
    return;
  }
  openArticle(h, false);
}

// ─── Events (delegated) ──────────────────────────────────────
document.addEventListener('click', e => {
  if (e.target.closest('[data-home]')) { goHome(); return; }
  if (e.target.closest('[data-tagtoggle]')) { tagsExpanded = !tagsExpanded; renderTags(); return; }
  if (e.target.closest('[data-clear]')) { clearTag(); return; }

  const tagEl = e.target.closest('[data-tag]');
  if (tagEl) { e.stopPropagation(); setTag(tagEl.dataset.tag); return; }

  const slugEl = e.target.closest('[data-slug]');
  if (slugEl) { openArticle(slugEl.dataset.slug); return; }
});

document.getElementById('search').addEventListener('input', e => {
  query = e.target.value.trim();
  renderList();
});

document.addEventListener('click', e => {
  if (e.target.closest('[data-random]')) randomArticle();
});

document.getElementById('rnd-btn').addEventListener('click', randomArticle);
document.getElementById('reader').addEventListener('scroll', updateProgress, { passive: true });

document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowRight')      { step(1);  e.preventDefault(); }
  else if (e.key === 'ArrowLeft')  { step(-1); e.preventDefault(); }
  else if (e.key === 'Escape')     { closeSidebar(); }
  else if (e.key === 'r' || e.key === 'R') { randomArticle(); }
  else if (e.key === 'h' || e.key === 'H') { goHome(); }
});

document.getElementById('menu-btn').addEventListener('click', openSidebar);
document.getElementById('scrim').addEventListener('click', closeSidebar);
window.addEventListener('hashchange', handleHash);

// ─── Boot ────────────────────────────────────────────────────
fetch('articles.json', { cache: 'no-cache' })
  .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
  .then(data => {
    ARTICLES = (Array.isArray(data) ? data : (data.articles || []))
      .filter(a => a && a.title && a.content)
      .map(a => Object.assign({}, a, { slug: a.slug || slugify(a.title) }))
      .sort((x, y) => new Date(y.date) - new Date(x.date));

    const seen = new Set();
    ARTICLES.forEach(a => {
      let base = a.slug || 'yazi', s = base, n = 2;
      while (seen.has(s)) s = base + '-' + n++;
      a.slug = s; seen.add(s);
    });

    renderCount();
    renderTags();
    renderList();
    handleHash();
  })
  .catch(err => {
    console.error(err);
    document.getElementById('reader-body').innerHTML =
      '<div class="intro"><div class="emo">🐕</div>' +
      '<h2>Yazılar yüklenemedi</h2>' +
      '<p>Arşiv dosyasına ulaşılamadı. Sayfayı yenilemeyi deneyebilirsin.</p></div>';
  });
</script>
</body>
</html>
