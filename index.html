<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tarihten Köpekler</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Köpeklerin ve köpek-insan ilişkisinin tarihi üzerine Türkçe yazılar. Evcilleştirmeden mitolojiye, savaştan bilime; her sabah yeni bir yazı.">
<meta property="og:title" content="Tarihten Köpekler">
<meta property="og:description" content="Köpek ve insanlık tarihi üzerine Türkçe yazılar. Her sabah yeni bir yazı.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tarihten.mehmetcihatkeles.com/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231A1814'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Georgia,serif' font-size='38' font-style='italic' fill='%23D6A65E'%3ET%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap">
<style>
/* Düzen: önce okuma. Ana sayfa bir gazetenin ön sayfası gibi: bugünün yazısı ve birkaç son yazı.
   Harita, dönemler ve etiketler ayrı bir Keşfet sayfasında. Tek yazı ailesi; etiketler küçük büyük harf. */
:root {
  --bg:        #F1EDE5;
  --surface:   #E8E2D6;
  --fg:        #24211C;
  --muted:     #6F685C;
  --rule:      #DAD3C5;
  --accent:    #8A581C;
  --sea:       #DFE2DE;
  --grat:      #CDD2CE;
  --land-lo:   #ECE3D0;
  --land-hi:   #B98A4B;
  --land-line: #A38D68;
  --t-konu:    #4C6A47;
  --t-yer:     #3D5E7E;
  --t-isim:    #87620F;
  --serif: 'EB Garamond', Garamond, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
  --measure: 35rem;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1A1814; --surface: #23201B; --fg: #E8E2D5; --muted: #A1998B; --rule: #332F28; --accent: #D6A65E;
    --sea: #1E2227; --grat: #2A2F35; --land-lo: #3A342A; --land-hi: #C99A55; --land-line: #5C523F;
    --t-konu: #9EBC93; --t-yer: #94B4D2; --t-isim: #E1BF6B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1A1814; --surface: #23201B; --fg: #E8E2D5; --muted: #A1998B; --rule: #332F28; --accent: #D6A65E;
  --sea: #1E2227; --grat: #2A2F35; --land-lo: #3A342A; --land-hi: #C99A55; --land-line: #5C523F;
  --t-konu: #9EBC93; --t-yer: #94B4D2; --t-isim: #E1BF6B;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--serif); font-size: 1.2rem; line-height: 1.6;
  font-feature-settings: "kern", "liga", "onum";
}
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
.lbl { font-variant-caps: all-small-caps; letter-spacing: .09em; font-size: 1.02rem; color: var(--accent); line-height: 1.3; }
.meta { font-style: italic; color: var(--muted); font-size: 1rem; line-height: 1.4; }
.meta .new { font-style: normal; font-variant-caps: all-small-caps; letter-spacing: .08em; color: var(--accent); }

/* ── üst çubuk ── */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg);
  border-bottom: 1px solid var(--rule);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar-in { max-width: 62rem; margin: 0 auto; height: 3.4rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.mark { text-decoration: none; font-size: 1.22rem; font-weight: 600; white-space: nowrap; display: flex; gap: .55rem; align-items: baseline; }
.mark .sep { color: var(--rule); font-weight: 400; }
.mark .brand em { font-style: normal; color: var(--accent); }
.nav { display: flex; gap: 1.25rem; align-items: baseline; font-size: 1.02rem; color: var(--muted); }
.nav a { text-decoration: none; }
.nav a:hover, .nav button:hover, .nav .on { color: var(--fg); }
#progress { position: absolute; left: 0; bottom: -1px; height: 2px; width: 0; background: var(--accent); }
@media (max-width: 640px) { .mark .author, .mark .sep { display: none; } .nav { gap: .95rem; font-size: .98rem; } .mark { font-size: 1.12rem; } }

main {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 4.5rem;
}
.col { max-width: var(--measure); margin: 0 auto; }
.col.wide { max-width: 42rem; }

/* ── ana sayfa ── */
.intro { padding: 3.4rem 0 2.6rem; border-bottom: 1px solid var(--rule); }
.intro h1 { font-weight: 500; font-size: clamp(2.05rem, 5.6vw, 2.75rem); line-height: 1.08; letter-spacing: -.01em; margin: 0 0 .8rem; text-wrap: balance; }
.intro h1 em { color: var(--accent); }
.intro p { margin: 0; color: var(--muted); font-size: 1.18rem; }
/* ── okura not: sayfaya sarkan bir kitap ayracı. Sitenin okurla konuştuğu her yer bu kartla görünür. ── */
.nudge {
  position: relative; margin: 1.8rem 0 0; padding: 1.1rem 1.3rem 1.2rem 3.15rem;
  background: color-mix(in oklab, var(--accent) 9%, var(--bg));
  border: 1px solid color-mix(in oklab, var(--accent) 30%, transparent);
  border-radius: 10px; max-width: 40rem;
}
.nudge .ribbon {
  position: absolute; left: 1.15rem; top: -1px; width: 1rem; height: 2.7rem; background: var(--accent);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 76%, 0 100%); transform-origin: top center;
  animation: ayrac .8s cubic-bezier(.2, .8, .3, 1.2) .25s both;
}
@keyframes ayrac { from { transform: scaleY(.35); } to { transform: scaleY(1); } }
.nudge .nk { font-variant-caps: all-small-caps; letter-spacing: .1em; color: var(--accent); font-size: 1rem; line-height: 1.2; }
.nudge p, .xhead .nudge p { margin: .3rem 0 0; font-size: 1.14rem; line-height: 1.45; color: var(--fg); }
.nudge p em { font-style: italic; }
.nudge-go {
  display: grid; grid-template-columns: 1fr auto; gap: .1rem 1rem; align-items: center;
  margin-top: .85rem; padding: .7rem .95rem; background: var(--bg); border: 1px solid var(--rule); border-radius: 8px;
  text-decoration: none; transition: border-color .15s, transform .15s;
}
.nudge-go span { grid-column: 1; font-variant-caps: all-small-caps; letter-spacing: .08em; color: var(--muted); font-size: .92rem; line-height: 1.2; }
.nudge-go b { grid-column: 1; font-weight: 500; font-size: 1.12rem; line-height: 1.28; }
.nudge-go i { grid-column: 2; grid-row: 1 / span 2; font-style: normal; color: var(--accent); font-size: 1.25rem; }
.nudge-go:hover { border-color: var(--accent); transform: translateX(2px); }
.nudge-go:hover b { color: var(--accent); }
button.nudge-go { width: 100%; text-align: left; font: inherit; color: inherit; }
@media (max-width: 520px) { .nudge { padding-left: 2.75rem; } .nudge .ribbon { left: .95rem; width: .85rem; } }
@media (prefers-reduced-motion: reduce) { .nudge .ribbon { animation: none; } .nudge-go { transition: none; } }

.lead { padding: 2.6rem 0 2.8rem; border-bottom: 1px solid var(--rule); }
.lead h2 { font-weight: 500; font-size: clamp(1.75rem, 4.6vw, 2.25rem); line-height: 1.14; margin: .5rem 0 .9rem; text-wrap: balance; }
.lead h2 a, .card h3 a, .next h3 a { text-decoration: none; }
.lead h2 a:hover, .card h3 a:hover, .next h3 a:hover { color: var(--accent); }
.lead p { margin: 0 0 1rem; font-size: 1.2rem; }
.go { color: var(--accent); text-decoration: none; font-style: italic; }
.go:hover { text-decoration: underline; text-underline-offset: 4px; }

.stream { padding-top: 2.2rem; }
.card { padding: 1.4rem 0 1.5rem; border-bottom: 1px solid var(--rule); }
.card .lbl { font-size: .95rem; }
.card h3 { font-weight: 500; font-size: 1.42rem; line-height: 1.2; margin: .3rem 0 .45rem; text-wrap: balance; }
.card p { margin: 0 0 .5rem; color: var(--muted); font-size: 1.08rem; line-height: 1.5; }
.card.isread h3 a { color: var(--muted); }
.more-row { padding-top: 1.8rem; display: flex; justify-content: center; }
.btn { font-size: 1.05rem; padding: .55rem 1.25rem; border: 1px solid var(--rule); border-radius: 999px; color: var(--fg); text-decoration: none; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.doors { margin-top: 3.2rem; padding: 1.8rem 0 0; border-top: 1px solid var(--rule); display: grid; gap: .5rem; }
.doors p { margin: 0; color: var(--muted); font-size: 1.1rem; }

/* ── yazı ── */
.rhead { padding: 3rem 0 2rem; }
.rhead .lbl a { text-decoration: none; }
.rhead .lbl a:hover { text-decoration: underline; text-underline-offset: 3px; }
.rhead h1 { font-weight: 500; font-size: clamp(1.95rem, 5.2vw, 2.7rem); line-height: 1.1; letter-spacing: -.01em; margin: .55rem 0 .9rem; text-wrap: balance; }
.prose { font-size: 1.24rem; line-height: 1.68; }
.prose p { margin: 0 0 1.05em; text-wrap: pretty; }
.prose > p:first-child { font-size: 1.1em; line-height: 1.6; }
.prose h2 { font-size: 1.45rem; font-weight: 600; line-height: 1.22; margin: 2.1em 0 .55em; text-wrap: balance; }
.prose h3 { font-size: 1.22rem; font-weight: 600; margin: 1.8em 0 .45em; }
.prose hr { border: 0; text-align: center; margin: 2.2em 0; }
.prose hr::after { content: "⁂"; color: var(--muted); }
.prose strong { font-weight: 600; }
.fin { text-align: center; color: var(--muted); margin: 2.4rem 0 0; letter-spacing: .4em; }

.next { margin-top: 3rem; padding: 1.8rem 0 2rem; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.next h3 { font-weight: 500; font-size: clamp(1.55rem, 4vw, 1.9rem); line-height: 1.15; margin: .45rem 0 .7rem; text-wrap: balance; }
.next p { margin: 0 0 .8rem; font-size: 1.12rem; color: var(--muted); }
.why { font-style: italic; color: var(--muted); font-size: 1rem; }
.also { margin-top: 2rem; }
.also ul { list-style: none; margin: .6rem 0 0; padding: 0; display: grid; gap: .9rem; }
.also a { text-decoration: none; font-size: 1.16rem; line-height: 1.3; }
.also a:hover { color: var(--accent); }
.also .why { display: block; margin-top: .1rem; }
.traces { margin-top: 2.6rem; font-size: 1.04rem; color: var(--muted); line-height: 1.9; }
.traces .lbl { margin-right: .5rem; }
.endlinks { margin-top: 1.6rem; display: flex; gap: 1.6rem; flex-wrap: wrap; font-size: 1.05rem; }
.endlinks a, .endlinks button { color: var(--muted); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 4px; }
.endlinks a:hover, .endlinks button:hover { color: var(--fg); }

/* ── etiket: renkli nokta + metin ── */
.t { text-decoration: none; display: inline-flex; align-items: baseline; gap: .38em; margin-right: .95em; white-space: nowrap; cursor: pointer; color: var(--fg); font-size: inherit; }
.t::before { content: ""; width: .48em; height: .48em; border-radius: 50%; background: var(--c); align-self: center; flex: none; }
.t.konu { --c: var(--t-konu); } .t.yer { --c: var(--t-yer); } .t.isim { --c: var(--t-isim); }
.t:hover span:first-child { text-decoration: underline; text-decoration-color: var(--c); text-underline-offset: 3px; }
.t.on span:first-child { color: var(--c); text-decoration: underline; text-underline-offset: 3px; }
.t .n { color: var(--muted); font-size: .85em; }

/* ── keşfet: bir vitrin. Koleksiyonlar, çağ odaları, dünya, isimler; her kapı kendi sayfasına açılır ── */
.col.wide { max-width: 60rem; }
.xhead p, .xhead .search { max-width: 40rem; }
.xhead { padding: 3rem 0 0; }
.xhead h1 { font-weight: 500; font-size: clamp(2.05rem, 5.4vw, 2.75rem); margin: .35rem 0 .6rem; line-height: 1.08; text-wrap: balance; }
.xhead p { margin: 0; color: var(--muted); font-size: 1.14rem; }
.search { position: relative; margin: 1.5rem 0 0; }
.search input { width: 100%; font: inherit; font-size: 1.12rem; color: var(--fg); background: transparent; border: 0; border-bottom: 1px solid var(--rule); padding: .45rem 0 .45rem 1.7rem; border-radius: 0; }
.search input::placeholder { color: var(--muted); font-style: italic; }
.search input:focus { outline: none; border-bottom-color: var(--accent); }
.search svg { position: absolute; left: 0; top: .8rem; width: 1.05rem; height: 1.05rem; stroke: var(--muted); fill: none; stroke-width: 1.6; }
.xsec { padding-top: 3rem; }
.xsec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
.xsec-h h2 { margin: 0; font-weight: 500; font-size: 1.6rem; line-height: 1.15; }
.xsec-h a { color: var(--muted); font-style: italic; text-decoration: none; font-size: 1.02rem; }
.xsec-h a:hover { color: var(--accent); }

.colls { display: grid; grid-template-columns: repeat(auto-fill, minmax(16.5rem, 1fr)); gap: 1rem; }
@media (max-width: 640px) {
  .colls { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: .8rem; margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding-right: 16px; }
  .coll { flex: 0 0 82%; scroll-snap-align: start; }
}
.coll { background: var(--surface); border-radius: 6px; padding: 1.25rem 1.3rem 1.2rem; display: flex; flex-direction: column; gap: .35rem; min-width: 0; }
.coll h3 { margin: .1rem 0 0; font-weight: 500; font-size: 1.42rem; line-height: 1.15; }
.coll h3 a { text-decoration: none; }
.coll h3 a:hover { color: var(--accent); }
.coll .note { margin: 0; font-style: italic; color: var(--muted); font-size: 1.02rem; line-height: 1.42; }
.coll ul { list-style: none; margin: .6rem 0 .2rem; padding: 0; display: grid; gap: .1rem; }
.coll li { border-top: 1px solid var(--rule); }
.coll li a { display: block; padding: .45rem 0; text-decoration: none; font-size: 1.02rem; line-height: 1.3; }
.coll li a:hover { color: var(--accent); }
.coll li.isread a { color: var(--muted); }
.coll .go { margin-top: auto; padding-top: .3rem; font-size: 1.02rem; }

.rooms { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 1.4rem; }
.room { border-top: 1px solid var(--rule); padding: .9rem 0 1.4rem; display: grid; gap: .15rem; align-content: start; }
.room .rn { font-style: italic; color: var(--accent); font-size: 1.25rem; line-height: 1; }
.room h3 { margin: .25rem 0 0; font-weight: 500; font-size: 1.3rem; line-height: 1.15; }
.room h3 a { text-decoration: none; }
.room h3 a:hover { color: var(--accent); }
.room .meta { font-size: .95rem; }
.room .bar { height: 3px; background: var(--rule); border-radius: 2px; margin: .45rem 0 .5rem; overflow: hidden; }
.room .bar i { display: block; height: 100%; background: var(--accent); opacity: .75; }
.room .pick { font-size: 1rem; line-height: 1.3; }
.room .pick a { text-decoration: none; }
.room .pick a:hover { color: var(--accent); }
.room .pick span { display: block; font-variant-caps: all-small-caps; letter-spacing: .07em; color: var(--muted); font-size: .9rem; }
@media (max-width: 640px) {
  .rooms { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 1rem; margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding-right: 16px; }
  .room { flex: 0 0 72%; scroll-snap-align: start; }
}

.world { display: grid; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); gap: 0 1.4rem; }
.world a { display: flex; justify-content: space-between; align-items: baseline; gap: .8rem; padding: .6rem 0; border-bottom: 1px solid var(--rule); text-decoration: none; font-size: 1.12rem; }
.world a:hover { color: var(--accent); }
.world a span { font-style: italic; color: var(--muted); font-size: .98rem; }

.names { font-size: 1.3rem; line-height: 1.75; }
.names a { text-decoration: none; margin-right: .9em; white-space: nowrap; }
.names a::before { content: ""; display: inline-block; width: .32em; height: .32em; border-radius: 50%; background: var(--c); margin-right: .38em; vertical-align: .2em; }
.names a.isim { --c: var(--t-isim); } .names a.yer { --c: var(--t-yer); }
.names a:hover { color: var(--accent); }
.lucky { margin-top: 3.4rem; }

/* liste sayfası: koleksiyon, çağ, bölge, isim */
.back { display: inline-block; margin-top: 2.2rem; color: var(--muted); text-decoration: none; font-size: 1.02rem; }
.back:hover { color: var(--fg); }
.lhead { padding: 1.4rem 0 1.2rem; border-bottom: 1px solid var(--rule); }
.lhead h1 { font-weight: 500; font-size: clamp(2rem, 5.2vw, 2.6rem); line-height: 1.1; margin: .35rem 0 .55rem; text-wrap: balance; }
.lhead p { margin: 0 0 .6rem; color: var(--muted); font-size: 1.14rem; font-style: italic; }
.others { margin-top: 3rem; padding-top: 1.4rem; border-top: 1px solid var(--rule); }
.others .lbl { display: block; margin-bottom: .4rem; }
.others nav { display: flex; flex-wrap: wrap; gap: .3rem 1.2rem; font-size: 1.08rem; }
.others a { text-decoration: none; }
.others a:hover { color: var(--accent); }

/* dizin */
.letters { display: flex; flex-wrap: wrap; gap: .1rem .75rem; margin-top: 1.3rem; font-size: 1.08rem; }
.letters button { color: var(--fg); min-width: 1.1rem; }
.letters button:hover { color: var(--accent); }
.konular { margin-top: 1.6rem; font-size: 1.04rem; line-height: 1.95; }
.konular .lbl { display: block; margin-bottom: .2rem; }
.ixl { padding-top: 2rem; scroll-margin-top: 4rem; }
.ixl > h3 { margin: 0 0 .4rem; font-weight: 500; font-style: italic; font-size: 1.7rem; color: var(--accent); line-height: 1; }
.ix { display: grid; grid-template-columns: minmax(8rem, 13rem) 1fr; gap: .2rem 1.2rem; padding: .6rem 0; border-top: 1px solid var(--rule); scroll-margin-top: 4.5rem; }
.ix dt { font-size: 1.12rem; line-height: 1.3; }
.ix dt a { text-decoration: none; }
.ix dt a:hover { color: var(--accent); }
.ix dt::before { content: ""; display: inline-block; width: .45em; height: .45em; border-radius: 50%; background: var(--c); margin-right: .45em; vertical-align: .12em; }
.ix.yer { --c: var(--t-yer); } .ix.isim { --c: var(--t-isim); }
.ix dt small { font-style: italic; color: var(--muted); font-size: .85rem; }
.ix dd { margin: 0; display: grid; gap: .2rem; }
.ix dd a { text-decoration: none; font-size: 1.04rem; line-height: 1.3; color: var(--muted); }
.ix dd a:hover { color: var(--accent); }
@media (max-width: 520px) { .ix { grid-template-columns: 1fr; } }
.empty { color: var(--muted); font-style: italic; padding: 1.4rem 0; }

footer {
  border-top: 1px solid var(--rule);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 1.6rem 2.4rem;
}
.foot-in { max-width: var(--measure); margin: 0 auto; display: grid; gap: .3rem; font-size: 1rem; color: var(--muted); }
.foot-in a { text-decoration: none; color: var(--fg); }
.foot-in a:hover { color: var(--accent); }
.foot-in em { font-style: normal; color: var(--accent); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <a class="mark" href="#" data-home="1"><span class="author">Mehmet Cihat Keleş</span><span class="sep">|</span><span class="brand">Tarihten <em>Köpekler</em></span></a>
    <nav class="nav" aria-label="Site">
      <a href="#/kesfet" id="nav-kesfet">Keşfet</a>
      <button type="button" data-random="1" title="Rastgele bir yazı (R)">Rastgele</button>
      <button type="button" id="theme-btn">Gece</button>
    </nav>
  </div>
  <div id="progress"></div>
</header>

<main id="app"><div class="col"><p class="meta" style="padding-top:3rem">Yazılar yükleniyor…</p></div></main>

<footer>
  <div class="foot-in">

<script>
// ─── Durum ───────────────────────────────────────────────────
let ARTICLES = [];
let view = 'home', activeSlug = null;
let query = '';
let shown = 6, homeScroll = 0, resumeTo = null;
const SITE = 'Tarihten Köpekler';

// ─── Etiketin üç ekseni ──────────────────────────────────────
//   @ → özel isim (köpek, kişi, mitolojik varlık) — altın
//   # → yer (ülke, bölge, şehir)                   — mavi
//   düz → konu                                      — yeşil
const isIsim = t => t.startsWith('@');
const isYer  = t => t.startsWith('#');
const eksen  = t => isIsim(t) ? 'isim' : isYer(t) ? 'yer' : 'konu';
const showTag = t => t.replace(/^[@#]/, '');

// ─── Bölgeler ────────────────────────────────────────────────
// Kaba kara parçaları; ülke sınırı değil, bir atlas sayfasına bakma duygusu.
// Yeni bir yer etiketi geldiğinde buraya eklenmeli; eklenmeyenler konsolda listelenir.
const BOLGE = {
  'Kuzey Amerika': { p: '26,30 112,21 142,42 132,68 100,88 66,84 40,62 20,44', cx: 80, cy: 50, ad: ['Kuzey', 'Amerika'],
    tags: ['#abd','#alaska','#kanada'] },
  'Orta ve Güney Amerika': { p: '90,112 132,106 152,134 144,184 120,238 98,252 84,224 94,178 80,142', cx: 116, cy: 172, ad: ['Orta ve', 'Güney Amerika'],
    tags: ['#meksika','#amerika','#peru','#and','#karayipler','#brezilya','#guatemala','#kuba','#küba','#haiti','#arjantin','#mezoamerika'] },
  'Avrupa': { p: '192,27 252,20 276,37 270,63 234,77 200,69 184,47', cx: 230, cy: 47, ad: ['Avrupa'],
    tags: ['#ingiltere','#fransa','#almanya','#avrupa','#ispanya','#isviçre','#italya','#hollanda','#iskandinavya','#norveç','#isveç',
           '#danimarka','#finlandiya','#polonya','#macaristan','#balkanlar','#ukrayna','#avusturya','#belçika','#izlanda','#bulgaristan','#hırvatistan'] },
  'Akdeniz': { p: '188,97 270,91 286,111 276,135 220,143 192,129 180,111', cx: 232, cy: 116, ad: ['Akdeniz'],
    tags: ['#roma','#yunanistan','#kartaca','#malta'] },
  'Afrika': { p: '194,167 270,161 298,187 290,223 264,257 234,269 212,243 198,207', cx: 246, cy: 210, ad: ['Afrika'],
    tags: ['#mısır','#namibya','#magrip','#etiyopya','#kongo','#nijerya','#güneyafrika','#tanzanya','#kanaryaadaları'] },
  'Anadolu ve Yakın Doğu': { p: '302,95 402,89 420,111 408,139 342,147 308,129', cx: 360, cy: 117, ad: ['Anadolu ve', 'Yakın Doğu'],
    tags: ['#anadolu','#istanbul','#ortadoğu','#iran','#mezopotamya','#suriye','#arabistan'] },
  'Orta Asya ve Sibirya': { p: '302,25 454,18 472,41 460,69 382,81 316,73 294,49', cx: 384, cy: 48, ad: ['Orta Asya ve', 'Sibirya'],
    tags: ['#ortaasya','#rusya','#sibirya','#kazakistan','#moğolistan','#tibet','#özbekistan','#afganistan','#grönland','#türkmenistan'] },
  'Doğu ve Güney Asya': { p: '430,97 530,91 550,119 540,159 502,193 472,187 454,151 436,125', cx: 494, cy: 138, ad: ['Doğu ve', 'Güney Asya'],
    tags: ['#çin','#japonya','#kore','#tayvan','#hindistan','#nepal','#srilanka','#pakistan','#vietnam','#tayland','#endonezya',
           '#filipinler','#malezya','#bali','#keşmir'] },
  'Okyanusya ve Kutuplar': { p: '472,213 554,207 572,233 558,267 504,273 478,251', cx: 522, cy: 240, ad: ['Okyanusya', 've Kutuplar'],
    tags: ['#avustralya','#polinezya','#yenizelanda','#hawaii','#pasifik','#antarktika','#kutup','#tazmanya','#yenigine'] },
};
const regionsOf = a => Object.keys(BOLGE).filter(r => (a.tags || []).some(t => BOLGE[r].tags.includes(t)));

// Dönem kuşakları: yazının "Dönem:" satırından gelir.
const DONEM = [
  { id: 'tarihoncesi', ad: 'Tarihöncesi',  ara: 'MÖ 3000 öncesi' },
  { id: 'antikite',    ad: 'Antikite',     ara: 'MÖ 3000 – MS 500' },
  { id: 'ortacag',     ad: 'Ortaçağ',      ara: '500 – 1500' },
  { id: 'erkenmodern', ad: 'Erken Modern', ara: '1500 – 1800' },
  { id: 'on9',         ad: '19. yüzyıl',   ara: '1800 – 1900' },
  { id: 'on20',        ad: '20. yüzyıl',   ara: '1900 sonrası' },
];
const eraName = id => (DONEM.find(d => d.id === id) || {}).ad || '';
const placeLine = a => [eraName(a.donem), regionsOf(a)[0]].filter(Boolean).join(' · ');

// ─── Yardımcılar ─────────────────────────────────────────────
const TR_MAP = { 'ç':'c','Ç':'c','ğ':'g','Ğ':'g','ı':'i','İ':'i','ö':'o','Ö':'o','ş':'s','Ş':'s','ü':'u','Ü':'u','â':'a','Â':'a','î':'i','Î':'i','û':'u','Û':'u' };
function slugify(s) {
  const full = String(s).replace(/[çÇğĞıİöÖşŞüÜâÂîÎûÛ]/g, c => TR_MAP[c] || c).toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  if (full.length <= 70) return full;
  const cut = full.slice(0, 70);
  return (full[70] === '-' ? cut : cut.replace(/-[^-]*$/, '')).replace(/-+$/, '');
}
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtDate = (iso, yil = true) => { const d = new Date(iso); if (isNaN(d)) return '';
  return d.toLocaleDateString('tr-TR', yil ? { day: 'numeric', month: 'long', year: 'numeric' } : { day: 'numeric', month: 'long' }); };
const monthKey = iso => new Date(iso).toLocaleDateString('tr-TR', { month: 'long', year: 'numeric' });
const readMin = md => Math.max(1, Math.ceil(md.split(/\s+/).length / 200));
const lower = s => s.toLocaleLowerCase('tr-TR');
const bodyWithoutTitle = md => md.replace(/^#\s+.+\n?/, '').trimStart();
function mdToHtml(md) {
  const span = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>');
  const out = []; let para = [];
  const flush = () => { if (para.length) { out.push('<p>' + span(para.join(' ')) + '</p>'); para = []; } };
  for (const raw of md.split('\n')) {
    const l = raw.trimEnd();
    if      (/^###\s/.test(l)) { flush(); out.push('<h3>' + span(l.slice(4)) + '</h3>'); }
    else if (/^##\s/.test(l))  { flush(); out.push('<h2>' + span(l.slice(3)) + '</h2>'); }
    else if (/^#\s/.test(l))   { flush(); out.push('<h2>' + span(l.slice(2)) + '</h2>'); }
    else if (/^---+$/.test(l)) { flush(); out.push('<hr>'); }
    else if (!l.trim())        { flush(); }
    else                       { para.push(l.trim()); }
  }
  flush();
  return out.join('\n');
}
function excerpt(md, n) {
  const t = bodyWithoutTitle(md).split('\n').filter(l => l.trim() && !l.startsWith('#') && !/^---+$/.test(l)).join(' ').replace(/[*_`]/g, '');
  return t.length > n ? t.slice(0, n).replace(/\s+\S*$/, '') + '…' : t;
}
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

// ─── Okur hafızası (yalnızca bu tarayıcıda) ──────────────────
let OKUNDU = new Set(store.get('tk-okundu', []));
let YARIM = store.get('tk-yarim', {});            // slug → okunan oran
const ONCEKI = store.get('tk-son', null);          // bir önceki gelişin zamanı
store.set('tk-son', Date.now());
const isNew = a => ONCEKI && new Date(a.date).getTime() > ONCEKI && !OKUNDU.has(a.slug);
function saveProgress(slug, r) {
  if (r >= .92) { if (!OKUNDU.has(slug)) { OKUNDU.add(slug); store.set('tk-okundu', [...OKUNDU]); }
    if (YARIM[slug] != null) { delete YARIM[slug]; store.set('tk-yarim', YARIM); } return; }
  if (r > .12 && !OKUNDU.has(slug) && Math.abs((YARIM[slug] || 0) - r) > .03) { YARIM[slug] = r; store.set('tk-yarim', YARIM); }
}

// ─── Veri ────────────────────────────────────────────────────
function tagCounts() {
  const m = new Map();
  ARTICLES.forEach(a => (a.tags || []).forEach(t => m.set(t, (m.get(t) || 0) + 1)));
  return [...m.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'tr'));
}
const regionCount = r => ARTICLES.filter(a => (a.tags || []).some(t => BOLGE[r].tags.includes(t))).length;
const eraCount = id => ARTICLES.filter(a => a.donem === id).length;

// Ortak etikete göre ilgili yazılar; özel isim (@) eşleşmesi üç kat ağır sayılır.
function related(a, n, haric) {
  const mine = new Set(a.tags || []);
  if (!mine.size) return [];
  return ARTICLES.filter(x => x.slug !== a.slug && !haric.has(x.slug))
    .map(x => { let s = 0; (x.tags || []).forEach(t => { if (mine.has(t)) s += isIsim(t) ? 3 : 1; }); return { x, s }; })
    .filter(r => r.s > 0)
    .sort((p, q) => q.s - p.s || new Date(q.x.date) - new Date(p.x.date))
    .slice(0, n).map(r => r.x);
}
// Bir yazının ardından önerilecek yazılar: önce okunmamışlar.
function nextReads(a) {
  const sayac = new Map(tagCounts());
  const agirlik = t => (isIsim(t) ? 0 : isYer(t) ? 1000 : 2000) + (sayac.get(t) || 0);
  const why = x => {
    const ortak = (x.tags || []).filter(t => (a.tags || []).includes(t)).sort((p, q) => agirlik(p) - agirlik(q));
    const t = ortak[0];
    if (!t) return '';
    if (isIsim(t)) return 'Burada da ' + showTag(t) + ' var.';
    if (isYer(t)) return 'Yine ' + showTag(t) + ' üzerine.';
    return 'Ortak konu: ' + ortak.filter(k => !isIsim(k) && !isYer(k)).slice(0, 2).map(showTag).join(', ') + '.';
  };
  const okunmamis = x => !OKUNDU.has(x.slug);
  const out = [], al = new Set([a.slug]);
  const ekle = (x, w) => { if (x && !al.has(x.slug)) { al.add(x.slug); out.push({ x, why: w }); } };
  const ilgili = related(a, 12, new Set());
  ilgili.filter(okunmamis).concat(ilgili).forEach(x => out.length < 2 && ekle(x, why(x)));
  const rg = regionsOf(a)[0];
  if (rg) { const ts = BOLGE[rg].tags;
    const c = ARTICLES.filter(x => !al.has(x.slug) && (x.tags || []).some(t => ts.includes(t)));
    ekle(c.find(okunmamis) || c[0], 'Aynı bölgeden: ' + rg + '.'); }
  if (a.donem) { const c = ARTICLES.filter(x => !al.has(x.slug) && x.donem === a.donem);
    ekle(c.find(okunmamis) || c[0], 'Aynı çağdan: ' + eraName(a.donem) + '.'); }
  return out.slice(0, 4);
}

// ─── Okura not ───────────────────────────────────────────────
// baslik: ayracın üstündeki kısa ad; metin: okura söylenen; git: önerilen yazıya giden kart.
function nudge(baslik, metin, git, sinif) {
  return '<aside class="nudge' + (sinif ? ' ' + sinif : '') + '" role="note"><span class="ribbon" aria-hidden="true"></span>' +
    '<div class="nk">' + baslik + '</div><p>' + metin + '</p>' + (git || '') + '</aside>';
}
const nudgeGo = (a, ust, extra) => '<a class="nudge-go" href="#/' + esc(a.slug) + '"' + (extra || '') + '><span>' + ust + '</span><b>' + esc(a.title) + '</b><i aria-hidden="true">→</i></a>';

// ─── Ana sayfa ───────────────────────────────────────────────
function cardHtml(a) {
  const r = OKUNDU.has(a.slug);
  return '<article class="card' + (r ? ' isread' : '') + '">' +
    (placeLine(a) ? '<div class="lbl">' + esc(placeLine(a)) + '</div>' : '') +
    '<h3><a href="#/' + esc(a.slug) + '">' + esc(a.title) + '</a></h3>' +
    '<p>' + esc(excerpt(a.content, 175)) + '</p>' +
    '<div class="meta">' + fmtDate(a.date, false) + ' · ' + readMin(a.content) + ' dk' +
      (isNew(a) ? ' · <span class="new">yeni</span>' : r ? ' · okundu' : '') + '</div></article>';
}
function renderHome() {
  view = 'home'; activeSlug = null;
  const lead = ARTICLES[0];
  const bugun = new Date().toDateString() === new Date(lead.date).toDateString();
  const yeniler = ARTICLES.filter(isNew).length;
  const yarimSlug = Object.keys(YARIM).filter(s => ARTICLES.some(a => a.slug === s) && !OKUNDU.has(s))[0];
  const yarim = yarimSlug && ARTICLES.find(a => a.slug === yarimSlug);
  const rest = ARTICLES.slice(1, 1 + shown);

  let notice = '';
  if (yarim) notice = nudge('Kaldığınız yer', 'Yarıda bıraktığınız bir yazı var. Kaldığınız satırdan açılır.',
    nudgeGo(yarim, 'Okuduğunuz kısım: yaklaşık %' + Math.round(YARIM[yarim.slug] * 100), ' data-resume="' + esc(yarim.slug) + '"'));
  else if (yeniler > 1) {
    const ilkYeni = ARTICLES.filter(isNew).pop();   // en eskisinden başlamak sırayı korur
    notice = nudge('Siz yokken', 'Son gelişinizden beri ' + yeniler + ' yeni yazı eklendi. Aşağıda <em>yeni</em> işaretiyle duruyorlar.',
      nudgeGo(ilkYeni, 'En eskisinden başlayın'));
  }

  document.getElementById('app').innerHTML =
    '<div class="col">' +
    '<section class="intro"><h1>Tarihin neresinde bir <em>köpek</em> vardı?</h1>' +
      '<p>Köpeklerin ve insanlarla ortak geçmişlerinin hikâyeleri. Her sabah bir yenisi ekleniyor.</p>' + notice + '</section>' +
    '<section class="lead">' +
      '<div class="lbl">' + (bugun ? 'Bugünün yazısı' : 'Son yazı') + (placeLine(lead) ? ' · ' + esc(placeLine(lead)) : '') + '</div>' +
      '<h2><a href="#/' + esc(lead.slug) + '">' + esc(lead.title) + '</a></h2>' +
      '<p>' + esc(excerpt(lead.content, 330)) + '</p>' +
      '<div class="meta">' + fmtDate(lead.date, false) + ' · ' + readMin(lead.content) + ' dk' +
        (OKUNDU.has(lead.slug) ? ' · okundu' : '') + '</div>' +
      '<p style="margin:1.1rem 0 0"><a class="go" href="#/' + esc(lead.slug) + '">Okumaya başla →</a></p>' +
    '</section>' +
    '<section class="stream"><div class="lbl">Son yazılar</div>' + rest.map(cardHtml).join('') +
      (ARTICLES.length > 1 + shown ? '<div class="more-row"><button type="button" class="btn" data-more="1">Daha eski yazılar</button></div>' : '') +
    '</section>' +
    '<section class="doors">' +
      '<p>Arşivdeki ' + ARTICLES.length + ' yazı koleksiyonlar, çağlar, bölgeler ve isimler hâlinde de dizili. Aklınızda bir konu, bir çağ ya da bir isim varsa oradan girin.</p>' +
      '<p><a class="go" href="#/kesfet">Keşfet sayfasına git →</a></p>' +
    '</section>' +
    '</div>';
  document.title = SITE;
}

// ─── Yazı ────────────────────────────────────────────────────
function tagLink(t, n) {
  return '<a class="t ' + eksen(t) + '" href="' + tagHref(t) + '" title="' + ({ konu: 'Konu', yer: 'Yer', isim: 'Özel isim' })[eksen(t)] + '">' +
    '<span>' + esc(nice(t)) + '</span>' + (n ? '<span class="n">' + n + '</span>' : '') + '</a>';
}
function renderArticle(a) {
  view = 'article'; activeSlug = a.slug;
  const rg = regionsOf(a);
  const ust = [];
  if (a.donem) ust.push('<a href="#/kesfet/cag/' + a.donem + '">' + esc(eraName(a.donem)) + '</a>');
  rg.forEach(r => ust.push('<a href="#/kesfet/yer/' + slugify(r) + '">' + esc(r) + '</a>'));
  const nx = nextReads(a);
  const ilk = nx[0], diger = nx.slice(1);
  const sira = t => ({ isim: 0, yer: 1, konu: 2 })[eksen(t)];
  const izler = (a.tags || []).slice().sort((p, q) => sira(p) - sira(q));

  document.getElementById('app').innerHTML =
    '<article class="col">' +
      '<header class="rhead">' +
        (ust.length ? '<div class="lbl">' + ust.join(' · ') + '</div>' : '') +
        '<h1>' + esc(a.title) + '</h1>' +
        '<div class="meta">' + fmtDate(a.date) + ' · ' + readMin(a.content) + ' dk</div>' +
      '</header>' +
      '<div class="prose" id="prose">' + mdToHtml(bodyWithoutTitle(a.content)) + '</div>' +
      '<div class="fin" aria-hidden="true">⁂</div>' +
      (ilk ? '<section class="next"><div class="lbl">Sıradaki yazı</div>' +
        '<h3><a href="#/' + esc(ilk.x.slug) + '">' + esc(ilk.x.title) + '</a></h3>' +
        '<p>' + esc(excerpt(ilk.x.content, 200)) + '</p>' +
        '<div class="why">' + esc(ilk.why) + ' · ' + readMin(ilk.x.content) + ' dk</div>' +
        '<p style="margin:.9rem 0 0"><a class="go" href="#/' + esc(ilk.x.slug) + '">Okumaya devam et →</a></p></section>' : '') +
      (diger.length ? '<section class="also"><div class="lbl">Ya da bunlardan biri</div><ul>' +
        diger.map(f => '<li><a href="#/' + esc(f.x.slug) + '">' + esc(f.x.title) + '</a><span class="why">' + esc(f.why) + '</span></li>').join('') +
        '</ul></section>' : '') +
      (izler.length ? '<div class="traces"><span class="lbl">Bu yazının izleri</span>' + izler.map(t => tagLink(t)).join('') + '</div>' : '') +
      '<div class="endlinks"><a href="#" data-home="1">Ana sayfa</a><button type="button" data-random="1">Rastgele bir yazı</button><a href="#/kesfet">Keşfet</a></div>' +
    '</article>';
  document.title = a.title + ' · ' + SITE;
}

// ─── Koleksiyonlar ───────────────────────────────────────────
// Konu etiketlerinden kendiliğinden oluşur; yeni bir yazı etiketine göre yerine düşer.
const KOLEKSIYON = [
  { id: 'kurttan-kopege', ad: 'Kurttan köpeğe', not: 'Köpek ne zaman, nerede ve nasıl köpek oldu? Kemikler, mezarlar ve ilk ortaklıklar.', tags: ['evcilleştirme', 'arkeoloji'] },
  { id: 'inanclar', ad: 'Tanrılar, ölüler, inançlar', not: 'Ölüleri uğurlayan, tapınakta beslenen, kimi zaman da kirli sayılan köpekler.', tags: ['din', 'mitoloji', 'ölü gömme'] },
  { id: 'irkin-icadi', ad: 'Irkın icadı', not: 'Soyağaçları, sergiler, yetiştiriciler: "saf" köpek fikri nereden çıktı?', tags: ['ırk', 'genetik'] },
  { id: 'kanunun-onunde', ad: 'Kanunun önünde', not: 'Vergiler, yasaklar, davalar: insanların köpekler hakkında yazdığı kurallar.', tags: ['hukuk', 'adalet'] },
  { id: 'savasta-seferde', ad: 'Savaşta ve seferde', not: 'Cephelerde, gemilerde ve buzların üstünde insanın yanında yürüyen köpekler.', tags: ['savaş', 'keşif'] },
  { id: 'bilimin-kopekleri', ad: 'Bilimin köpekleri', not: 'Salgınlar, deneyler ve köpeğin bedeni hakkında bilimin öğrendikleri.', tags: ['bilim', 'biyoloji', 'salgın', 'terapi'] },
  { id: 'is-goren-kopekler', ad: 'İş gören köpekler', not: 'Çoban, kızak, av ve bekçi köpekleri: emeğin ve davranışın tarihi.', tags: ['işlevsel köpekler', 'davranış'] },
  { id: 'sehirde-sokakta', ad: 'Şehirde ve sokakta', not: 'Kentler büyürken sokağın köpeklerine ne oldu?', tags: ['şehir', 'toplum'] },
  { id: 'resimde-kitapta', ad: 'Resimde ve kitapta', not: 'Ressamların, yazarların ve hikâye anlatıcılarının köpekleri.', tags: ['sanat', 'edebiyat', 'viktorya dönemi'] },
];
const inColl = (k, a) => (a.tags || []).some(t => k.tags.includes(t));
const collArts = k => ARTICLES.filter(a => inColl(k, a));
const regionArts = r => ARTICLES.filter(a => (a.tags || []).some(t => BOLGE[r].tags.includes(t)));
const regionBySlug = s => Object.keys(BOLGE).find(r => slugify(r) === s);
const YONELME = { tarihoncesi: "Tarihöncesi'ne", antikite: "Antikite'ye", ortacag: "Ortaçağ'a", erkenmodern: 'Erken Modern döneme', on9: '19. yüzyıla', on20: '20. yüzyıla' };
const ROMA = ['I', 'II', 'III', 'IV', 'V', 'VI'];
const unreadFirst = list => list.filter(a => !OKUNDU.has(a.slug)).concat(list.filter(a => OKUNDU.has(a.slug)));
const tagHref = t => '#/kesfet/e/' + encodeURIComponent(t);

// ─── Okunur adlar ────────────────────────────────────────────
// Etiketler sıkıştırılmış yazılır (@dorothygoodale, #kanaryaadaları). Düzgün görünsünler diye
// ad, o etiketi taşıyan yazıların metninde aranıp bulunur: "Dorothy Goodale", "Kanarya Adaları".
const _ad = new Map();
const normAd = s => s.toLocaleLowerCase('tr-TR').replace(/ı/g, 'i').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[-'’.]/g, '');
const capTr = s => s.charAt(0).toLocaleUpperCase('tr-TR') + s.slice(1);
function nice(t) {
  if (eksen(t) === 'konu') return t;
  if (_ad.has(t)) return _ad.get(t);
  const base = showTag(t), hedef = normAd(base);
  let bulunan = null, yakin = null;
  for (const a of ARTICLES) {
    if (bulunan || !(a.tags || []).includes(t)) continue;
    const tok = a.content.match(/[\p{L}][\p{L}\-'’.]*/gu) || [];
    for (let i = 0; i < tok.length && !bulunan; i++) {
      if (!/^\p{Lu}/u.test(tok[i])) continue;
      let bir = '';
      for (let k = 0; k < 4 && i + k < tok.length; k++) {
        const kok = tok[i + k].replace(/['’].*$/, '').replace(/[.\-]+$/, '');
        bir += normAd(kok);
        if (bir === hedef) { bulunan = tok.slice(i, i + k).concat(kok).join(' '); break; }
        if (!yakin && k > 0 && bir.startsWith(hedef) && bir.length - hedef.length <= 3)
          yakin = tok.slice(i, i + k).concat(kok.slice(0, kok.length - (bir.length - hedef.length))).join(' ');
        if (!hedef.startsWith(bir)) break;
      }
    }
  }
  const ad = bulunan || yakin || capTr(base);
  _ad.set(t, ad);
  return ad;
}

// ─── Keşfet: vitrin ──────────────────────────────────────────
function journeyNote() {
  const n = ARTICLES.filter(a => OKUNDU.has(a.slug)).length;
  if (!n) return '';
  const bos = DONEM.find(d => eraCount(d.id) && !ARTICLES.some(a => a.donem === d.id && OKUNDU.has(a.slug)));
  if (!bos) return nudge('Sizin için bir not', 'Şimdiye kadar ' + n + ' yazı okudunuz ve her çağdan en az birine uğradınız. Bir koleksiyonu baştan sona okumaya ne dersiniz?');
  const oneri = unreadFirst(ARTICLES.filter(a => a.donem === bos.id))[0];
  return nudge('Sizin için bir not', 'Şimdiye kadar ' + n + ' yazı okudunuz. ' + YONELME[bos.id] + ' henüz hiç uğramadınız.',
    nudgeGo(oneri, 'Oradan bir başlangıç · ' + readMin(oneri.content) + ' dk'));
}

function renderExplore() {
  view = 'explore'; activeSlug = null;
  document.getElementById('app').innerHTML =
    '<div class="col wide">' +
    '<header class="xhead"><div class="lbl">Keşfet</div><h1>Nereden başlamak istersiniz?</h1>' +
      '<p>Arşivde ' + ARTICLES.length + ' yazı var. Bir konudan, bir çağdan, dünyanın bir köşesinden ya da bir isimden girin.</p>' +
      '<div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>' +
      '<input id="q" type="search" placeholder="Ya da aradığınızı yazın: bir isim, bir yer, bir kelime" aria-label="Arşivde ara" value="' + esc(query) + '"></div>' +
      journeyNote() +
    '</header><div id="xbody"></div></div>';
  document.getElementById('q').addEventListener('input', e => { query = e.target.value.trim(); exploreBody(); });
  exploreBody();
  document.title = 'Keşfet · ' + SITE;
}

function exploreBody() {
  const el = document.getElementById('xbody');
  if (query) {
    const q = lower(query);
    const list = ARTICLES.filter(a => lower(a.title).includes(q) || lower(a.content).includes(q) ||
      (a.tags || []).some(t => lower(nice(t)).includes(q)));
    el.innerHTML = '<section class="xsec" style="padding-top:1.6rem"><div class="meta">' + (list.length ? list.length + ' yazı bulundu' : 'Bu aramayla eşleşen yazı yok.') + '</div>' +
      list.slice(0, 40).map(cardHtml).join('') + '</section>';
    return;
  }
  // Koleksiyonlar
  const kol = KOLEKSIYON.map(k => ({ k, arts: collArts(k) })).filter(x => x.arts.length >= 3);
  const kullanildi = new Set();   // aynı yazı iki kartta birden görünmesin
  const kolHtml = kol.map(({ k, arts }) => {
    const ornek = unreadFirst(arts).filter(a => !kullanildi.has(a.slug)).slice(0, 3);
    ornek.forEach(a => kullanildi.add(a.slug));
    return '<article class="coll"><div class="lbl">' + arts.length + ' yazı</div>' +
      '<h3><a href="#/kesfet/k/' + k.id + '">' + esc(k.ad) + '</a></h3><p class="note">' + esc(k.not) + '</p>' +
      '<ul>' + ornek.map(a => '<li' + (OKUNDU.has(a.slug) ? ' class="isread"' : '') + '><a href="#/' + esc(a.slug) + '">' + esc(a.title) + '</a></li>').join('') + '</ul>' +
      '<a class="go" href="#/kesfet/k/' + k.id + '">Koleksiyonun tamamı →</a></article>';
  }).join('');
  // Çağ odaları
  const enCok = Math.max(1, ...DONEM.map(d => eraCount(d.id)));
  const odalar = DONEM.map((d, i) => {
    const arts = ARTICLES.filter(a => a.donem === d.id);
    if (!arts.length) return '';
    const sec = unreadFirst(arts)[0];
    return '<div class="room"><div class="rn">' + ROMA[i] + '</div>' +
      '<h3><a href="#/kesfet/cag/' + d.id + '">' + esc(d.ad) + '</a></h3>' +
      '<div class="meta">' + esc(d.ara) + ' · ' + arts.length + ' yazı</div>' +
      '<div class="bar" aria-hidden="true"><i style="width:' + Math.round(100 * arts.length / enCok) + '%"></i></div>' +
      '<div class="pick"><span>Bu odadan</span><a href="#/' + esc(sec.slug) + '">' + esc(sec.title) + '</a></div></div>';
  }).join('');
  // Dünya
  const dunya = Object.keys(BOLGE).map(r => ({ r, n: regionCount(r) })).filter(x => x.n).sort((x, y) => y.n - x.n)
    .map(x => '<a href="#/kesfet/yer/' + slugify(x.r) + '">' + esc(x.r) + '<span>' + x.n + '</span></a>').join('');
  // İsimler: her gelişte başka bir demet
  const isimler = tagCounts().filter(([t]) => eksen(t) === 'isim').map(([t]) => t);
  for (let i = isimler.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [isimler[i], isimler[j]] = [isimler[j], isimler[i]]; }
  const demet = isimler.slice(0, 16).map(t => '<a class="isim" href="' + tagHref(t) + '">' + esc(nice(t)) + '</a>').join('');

  el.innerHTML =
    '<section class="xsec"><div class="xsec-h"><h2>Koleksiyonlar</h2><span class="meta">Konularına göre bir araya gelmiş yazılar</span></div><div class="colls">' + kolHtml + '</div></section>' +
    '<section class="xsec"><div class="xsec-h"><h2>Çağdan çağa</h2></div><div class="rooms">' + odalar + '</div></section>' +
    '<section class="xsec"><div class="xsec-h"><h2>Dünyanın dört bir yanı</h2></div><div class="world">' + dunya + '</div></section>' +
    '<section class="xsec"><div class="xsec-h"><h2>Bu arşivde kimler var?</h2><a href="#/kesfet/dizin">Bütün isimler ve yerler →</a></div>' +
      '<div class="names">' + demet + '</div></section>' +
    nudge('Kararsız mısınız?', 'Bazen en iyi yazı aramadığınız yazıdır. Henüz okumadıklarınızdan birini sizin için seçelim.',
      '<button type="button" class="nudge-go" data-random="1"><span>Rastgele</span><b>Şansıma bir yazı aç</b><i aria-hidden="true">→</i></button>', 'lucky');
}

// ─── Keşfet: liste sayfaları ─────────────────────────────────
function renderList(kind, key) {
  view = 'list'; activeSlug = null;
  let lbl = '', baslik = '', not = '', list = [], digerleri = '';
  if (kind === 'k') {
    const k = KOLEKSIYON.find(x => x.id === key); if (!k) return false;
    lbl = 'Koleksiyon'; baslik = k.ad; not = k.not; list = collArts(k);
    digerleri = KOLEKSIYON.filter(x => x !== k && collArts(x).length >= 3).map(x => '<a href="#/kesfet/k/' + x.id + '">' + esc(x.ad) + '</a>').join('');
  } else if (kind === 'cag') {
    const d = DONEM.find(x => x.id === key); if (!d) return false;
    lbl = 'Çağ · ' + d.ara; baslik = d.ad; list = ARTICLES.filter(a => a.donem === d.id);
    digerleri = DONEM.filter(x => x !== d && eraCount(x.id)).map(x => '<a href="#/kesfet/cag/' + x.id + '">' + esc(x.ad) + '</a>').join('');
  } else if (kind === 'yer') {
    const r = regionBySlug(key); if (!r) return false;
    lbl = 'Dünyanın bir köşesi'; baslik = r; list = regionArts(r);
    digerleri = Object.keys(BOLGE).filter(x => x !== r && regionCount(x)).map(x => '<a href="#/kesfet/yer/' + slugify(x) + '">' + esc(x) + '</a>').join('');
  } else if (kind === 'e') {
    const t = key; list = ARTICLES.filter(a => (a.tags || []).includes(t)); if (!list.length) return false;
    lbl = ({ konu: 'Konu', yer: 'Yer', isim: 'İsim' })[eksen(t)]; baslik = eksen(t) === 'konu' ? capTr(t) : nice(t);
    const k = eksen(t) === 'konu' && KOLEKSIYON.find(x => x.tags.includes(t));
    if (k) not = 'Bu konu "' + k.ad + '" koleksiyonunun bir parçası.';
  } else return false;
  const okunan = list.filter(a => OKUNDU.has(a.slug)).length;
  document.getElementById('app').innerHTML =
    '<div class="col">' +
    '<a class="back" href="#/kesfet">← Keşfet</a>' +
    '<header class="lhead"><div class="lbl">' + esc(lbl) + '</div><h1>' + esc(baslik) + '</h1>' + (not ? '<p>' + esc(not) + '</p>' : '') +
      '<div class="meta">' + list.length + ' yazı' + (okunan ? ' · ' + okunan + ' tanesini okudunuz' : '') + '</div></header>' +
    unreadFirst(list).map(cardHtml).join('') +
    (digerleri ? '<div class="others"><span class="lbl">Başka bir kapı</span><nav>' + digerleri + '</nav></div>' : '') +
    '</div>';
  document.title = baslik + ' · ' + SITE;
  return true;
}

// ─── Keşfet: dizin ───────────────────────────────────────────
const harfOf = s => s.charAt(0).toLocaleUpperCase('tr-TR');
function renderIndex() {
  view = 'list'; activeSlug = null;
  document.getElementById('app').innerHTML =
    '<div class="col wide"><a class="back" href="#/kesfet">← Keşfet</a>' +
    '<header class="lhead"><div class="lbl">Dizin</div><h1>İsimler ve yerler</h1>' +
      '<p>Yazılarda geçen kişiler, köpekler, tanrılar ve yerler; her birinin yanında geçtiği yazılar.</p>' +
      '<div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>' +
      '<input id="iq" type="search" placeholder="Bir isim ya da yer ara" aria-label="Dizinde ara"></div></header>' +
    '<div id="ixbody"></div></div>';
  const fill = q => {
    const counts = tagCounts();
    const konular = counts.filter(([t]) => eksen(t) === 'konu').map(([t]) => t).sort((x, y) => x.localeCompare(y, 'tr'));
    let e = counts.filter(([t]) => eksen(t) !== 'konu').map(([t]) => ({ t, ad: nice(t), arts: ARTICLES.filter(a => (a.tags || []).includes(t)) }));
    if (q) { const n = normAd(q); e = e.filter(x => normAd(x.ad).includes(n)); }
    e.sort((x, y) => x.ad.localeCompare(y.ad, 'tr'));
    const g = [];
    e.forEach(x => { const h = harfOf(x.ad), s = g[g.length - 1]; if (s && s.h === h) s.e.push(x); else g.push({ h, e: [x] }); });
    document.getElementById('ixbody').innerHTML =
      (q ? '' : '<div class="konular"><span class="lbl">Konular</span>' + konular.map(t => tagLink(t)).join('') + '</div>') +
      (g.length > 1 ? '<div class="letters">' + g.map(s => '<button type="button" data-letter="' + esc(s.h) + '">' + esc(s.h) + '</button>').join('') + '</div>' : '') +
      (g.length ? g.map(s => '<section class="ixl" id="ixl-' + esc(s.h) + '"><h3>' + esc(s.h) + '</h3><dl>' +
        s.e.map(x => '<div class="ix ' + eksen(x.t) + '"><dt><a href="' + tagHref(x.t) + '">' + esc(x.ad) + '</a>' +
          (eksen(x.t) === 'yer' ? ' <small>yer</small>' : '') + '</dt><dd>' +
          x.arts.map(a => '<a href="#/' + esc(a.slug) + '">' + esc(a.title) + '</a>').join('') + '</dd></div>').join('') +
        '</dl></section>').join('') : '<p class="empty">Bu adla eşleşen bir isim ya da yer yok.</p>');
  };
  document.getElementById('iq').addEventListener('input', ev => fill(ev.target.value.trim()));
  fill('');
  document.title = 'Dizin · ' + SITE;
}

// ─── Gezinme ─────────────────────────────────────────────────
function route() {
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  const from = view;
  if (from === 'home') homeScroll = window.scrollY;
  document.getElementById('nav-kesfet').classList.toggle('on', h.startsWith('kesfet'));
  let ok = true;
  if (h === 'kesfet') renderExplore();
  else if (h === 'kesfet/dizin') renderIndex();
  else if (h.startsWith('kesfet/')) { const m = h.match(/^kesfet\/(k|cag|yer|e)\/(.+)$/); ok = !!m && renderList(m[1], m[2]); }
  else {
    const a = h && ARTICLES.find(x => x.slug === h);
    if (a) {
      renderArticle(a);
      if (resumeTo === a.slug && YARIM[a.slug]) {
        const p = document.getElementById('prose');
        window.scrollTo(0, Math.max(0, p.offsetTop + p.offsetHeight * YARIM[a.slug] - window.innerHeight * .6));
      } else window.scrollTo(0, 0);
      resumeTo = null; progress(); return;
    }
    ok = false;
  }
  if (!ok) { renderHome(); window.scrollTo(0, from === 'article' ? homeScroll : 0); }
  else window.scrollTo(0, 0);
  progress();
}
const go = h => { if (location.hash.replace(/^#/, '') === h) route(); else location.hash = h; };
function randomArticle() {
  const pool = ARTICLES.filter(a => a.slug !== activeSlug && !OKUNDU.has(a.slug));
  const src = pool.length ? pool : ARTICLES.filter(a => a.slug !== activeSlug);
  if (src.length) go('/' + src[Math.floor(Math.random() * src.length)].slug);
}
function step(dir) {
  const i = ARTICLES.findIndex(x => x.slug === activeSlug), j = i + dir;
  if (i >= 0 && j >= 0 && j < ARTICLES.length) go('/' + ARTICLES[j].slug);
}
let tick = 0;
function progress() {
  const bar = document.getElementById('progress');
  if (view !== 'article') { bar.style.width = '0'; return; }
  const p = document.getElementById('prose'); if (!p) return;
  const r = Math.min(1, Math.max(0, (window.scrollY + window.innerHeight - p.offsetTop) / p.offsetHeight));
  bar.style.width = (r * 100) + '%';
  const now = Date.now(); if (now - tick > 600 || r >= .92) { tick = now; saveProgress(activeSlug, r); }
}

// ─── Tema ────────────────────────────────────────────────────
const isDark = () => { const d = document.documentElement.getAttribute('data-theme');
  return d ? d === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches; };
const themeLabel = () => { document.getElementById('theme-btn').textContent = isDark() ? 'Gündüz' : 'Gece'; };
(function () { const t = store.get('tk-tema', null); if (t) document.documentElement.setAttribute('data-theme', t); })();
document.getElementById('theme-btn').addEventListener('click', () => {
  const t = isDark() ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', t); store.set('tk-tema', t); themeLabel(); });
themeLabel();

// ─── Olaylar ─────────────────────────────────────────────────
document.addEventListener('click', e => {
  const t = e.target;
  const rs = t.closest('[data-resume]'); if (rs) { resumeTo = rs.dataset.resume; return; }
  if (t.closest('[data-home]')) { e.preventDefault(); go(''); return; }
  if (t.closest('[data-random]')) { randomArticle(); return; }
  if (t.closest('[data-more]')) { shown += 8; const y = window.scrollY; renderHome(); window.scrollTo(0, y); return; }
  const lt = t.closest('[data-letter]'); if (lt) { const el = document.getElementById('ixl-' + lt.dataset.letter); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    const g = e.target.closest && e.target.closest('g[data-region], g[data-era]');
    if (g) { e.preventDefault(); g.dispatchEvent(new MouseEvent('click', { bubbles: true })); return; }
  }
  if (e.target.matches('input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowRight' && view === 'article') { step(1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft' && view === 'article') { step(-1); e.preventDefault(); }
  else if (e.key === 'r' || e.key === 'R') randomArticle();
  else if (e.key === 'h' || e.key === 'H') go('');
});
window.addEventListener('scroll', progress, { passive: true });
window.addEventListener('hashchange', route);

// ─── Açılış ──────────────────────────────────────────────────
function boot(data) {
  ARTICLES = (Array.isArray(data) ? data : (data.articles || [])).filter(a => a && a.title && a.content)
    .map(a => Object.assign({}, a, { slug: a.slug || slugify(a.title) }))
    .sort((x, y) => new Date(y.date) - new Date(x.date));
  const seen = new Set();
  ARTICLES.forEach(a => { let b = a.slug || 'yazi', s = b, n = 2; while (seen.has(s)) s = b + '-' + n++; a.slug = s; seen.add(s); });
  const bilinen = new Set(Object.values(BOLGE).flatMap(b => b.tags));
  const eksik = [...new Set(ARTICLES.flatMap(a => (a.tags || []).filter(t => isYer(t) && !bilinen.has(t))))];
  if (eksik.length) console.info('Haritada bölgesi tanımlanmamış yer etiketleri:', eksik.join(', '));
  if (!ARTICLES.length) { document.getElementById('app').innerHTML = '<div class="col"><section class="intro"><h1>Arşiv hazırlanıyor</h1><p>Henüz yayımlanmış bir yazı yok.</p></section></div>'; return; }
  route();
}
if (window.__ARTICLES__) boot(window.__ARTICLES__);
else fetch('articles.json', { cache: 'no-cache' })
  .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
  .then(boot)
  .catch(err => { console.error(err);
    document.getElementById('app').innerHTML = '<div class="col"><section class="intro"><h1>Yazılar yüklenemedi</h1><p>Arşiv dosyasına ulaşılamadı. Sayfayı yenilemeyi deneyin.</p></section></div>'; });
</script>
